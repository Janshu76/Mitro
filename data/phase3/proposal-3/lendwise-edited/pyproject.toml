[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mitro-lendwise-fixture"
version = "0.1.0"
description = "Synthetic lending application for Mitro code impact analysis"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "sqlalchemy>=2.0", "pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
