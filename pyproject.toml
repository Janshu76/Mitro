[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mitro-regulatory-engineering"
version = "0.1.0"
description = "India-focused regulatory intelligence and code impact MVP"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "pymupdf>=1.24", "pypdf>=5.0", "python-multipart>=0.0.9", "pyyaml>=6.0", "sqlglot>=25.0", "networkx>=3.3", "httpx>=0.27", "psycopg[binary]>=3.2", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mitro*", "amend*"]



[tool.setuptools.package-data]
amend = ["data_classes.yaml"]

